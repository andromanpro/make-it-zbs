name: Windows Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: powershell

env:
  ZbsPythonCommand: python

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.103
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.2
      - name: Headless tests, coverage, dependencies and reproducible binaries
        run: ./tools/ci.ps1 -VerifyReleaseDll
      - name: Build independent OneScript Windows library and its source package
        run: python libraries/onescript-windows/build.py
      - name: Public source inventory
        run: python tools/export-public-source.py artifacts/public-source
      - name: Secret scan including vendored archives
        run: python tools/run-secret-audit.py artifacts/public-source
      - name: Build unsigned beta candidate
        run: python tools/build-release.py --version v0.5.0-beta.4-ci
      - name: Verify portable package without global OneScript
        run: python tools/verify-dist.py dist/MakeItZBS --run-probe
      - name: Upload verification evidence and beta candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-verification
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/reproducible-build.json
            artifacts/ui-tests/**/summary.json
            artifacts/onescript-tests/**/summary.json
            artifacts/coverage/**
            artifacts/public-secret-audit/**
            dist/releases/*.zip
            dist/releases/*.sha256
            dist/libraries/*.zip
            dist/libraries/*.sha256
            artifacts/windows-library/**/summary.json

# UI/Word/Paint runs require an interactive desktop and remain a release check.
# This workflow does not publish releases, receive a signing key or contact LAN Sonar.
